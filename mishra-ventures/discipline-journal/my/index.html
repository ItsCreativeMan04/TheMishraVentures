<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>My Journal — private</title>

  <link rel="stylesheet" href="../../shared/global.css?v=20260731b" />
  <link rel="stylesheet" href="../../shared/components.css?v=20260731b" />

  <script>
    (function () {
      try {
        var s = localStorage.getItem('lm-theme');
        document.documentElement.setAttribute('data-theme',
          s || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
      } catch (e) {}
    })();
  </script>

  <style>
    /* THIS FILE CONTAINS NO TRADE DATA.
       It is a shell. Real fills and P&L live in journal.json, which is
       uploaded straight to Hostinger by the platform's nightly job and is
       never committed to this repository. Access control is the .htaccess
       alongside it; this separation is what limits the damage if that access
       control is ever misconfigured. */
    :root {
      --bg:#0c0a07; --surface:#14110c; --surface-2:#1b1710;
      --border:rgba(255,237,213,.12); --border-strong:rgba(255,237,213,.24);
      --text-strong:#fffaf3; --text:rgba(255,250,243,.85); --muted:rgba(255,250,243,.55);
      --faint:rgba(255,250,243,.32); --accent:#f59e0b;
      --green:#4ade80; --green-bg:rgba(74,222,128,.13);
      --red:#f87171; --red-bg:rgba(248,113,113,.13);
      --yellow:#facc15; --yellow-bg:rgba(250,204,21,.13);
      --shadow:0 18px 44px rgba(0,0,0,.5);
    }
    html[data-theme="light"] {
      --bg:#f7f3ec; --surface:#fff; --surface-2:#fdfaf5;
      --border:rgba(69,39,12,.14); --border-strong:rgba(69,39,12,.26);
      --text-strong:#1b1308; --text:#2d2113; --muted:rgba(45,33,19,.62);
      --faint:rgba(45,33,19,.4); --accent:#b45309;
      --green:#15803d; --green-bg:rgba(21,128,61,.11);
      --red:#b91c1c; --red-bg:rgba(185,28,28,.1);
      --yellow:#a16207; --yellow-bg:rgba(161,98,7,.12);
      --shadow:0 12px 30px rgba(69,39,12,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);
      font-family:var(--font-base,system-ui,-apple-system,sans-serif);line-height:1.6;
      -webkit-font-smoothing:antialiased}
    .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
    .wrap{max-width:980px;margin:0 auto;padding:1.6rem 1.2rem 4rem}

    .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:1.1rem}
    .top h1{font-size:clamp(1.3rem,4vw,1.75rem);margin:0;color:var(--text-strong);letter-spacing:-.02em}
    .stamp{font-size:11.5px;color:var(--faint)}
    .private{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:1.4px;
      text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);
      border-radius:100px;padding:3px 10px;font-weight:700}

    .stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);
      border-radius:16px;overflow:hidden;background:var(--surface);margin-bottom:1rem}
    .stat{padding:1rem 1.1rem;border-right:1px solid var(--border)}
    .stat:last-child{border-right:0}
    .stat .k{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint)}
    .stat .v{font-size:clamp(1.2rem,3.4vw,1.6rem);font-weight:700;color:var(--text-strong);margin-top:3px}
    .stat .v.good{color:var(--green)} .stat .v.warn{color:var(--accent)} .stat .v.bad{color:var(--red)}
    .sfx{font-size:.7rem;color:var(--faint);font-weight:400}

    .panel{border:1px solid var(--border);border-radius:16px;background:var(--surface);
      margin-bottom:1rem;overflow:hidden}
    .panel h2{margin:0;padding:.85rem 1.15rem;font-size:.85rem;color:var(--text-strong);
      border-bottom:1px solid var(--border);background:var(--surface-2)}
    .panel .body{padding:1rem 1.15rem}

    /* ── Calendar heatmap ──
       A month grid, not a flat strip. A strip of squares tells you how many
       days you logged; a calendar tells you WHEN — which weekday you break
       rules on, whether a bad run clustered, whether you skipped a whole week.
       That is the pattern a discipline journal exists to surface. */
    .cal-wrap{display:flex;flex-wrap:wrap;gap:1.4rem}
    .cal{min-width:212px}
    .cal-title{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;
      color:var(--faint);margin-bottom:.5rem}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
    .dow{font-size:9px;text-align:center;color:var(--faint);padding-bottom:2px}
    .day{aspect-ratio:1;min-height:26px;border-radius:7px;border:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;font-size:10.5px;
      color:var(--faint);background:transparent}
    .day.pad{border:0;background:transparent}
    /* No entry for a weekday: an outline, not a colour. An untraded day and a
       day you have no data for must not look the same as a disciplined one. */
    .day.none{border-style:dashed;opacity:.4}
    .day.has{cursor:pointer}
    .day.has:hover{border-color:var(--border-strong)}
    .day.PASS{background:var(--green-bg);border-color:rgba(74,222,128,.45);color:var(--green)}
    .day.FAIL{background:var(--red-bg);border-color:rgba(248,113,113,.45);color:var(--red)}
    .day.UNKNOWN{background:var(--yellow-bg);border-color:rgba(250,204,21,.45);color:var(--yellow)}
    .day.LUCKY{background:rgba(245,158,11,.18);border-color:var(--accent);color:var(--accent);
      font-weight:700}
    .day.FLAT{background:var(--surface-2);border-color:var(--border-strong);color:var(--muted)}
    .day.sel{outline:2px solid var(--accent);outline-offset:1px}
    .legend{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:.9rem;font-size:11px;color:var(--muted)}
    .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;
      margin-right:5px;vertical-align:-1px;border:1px solid var(--border)}

    /* ── Expandable trade rows ── */
    .entry.clickable{cursor:pointer}
    .entry.clickable:hover{background:var(--surface-2)}
    .chev{font-size:10px;color:var(--faint);transition:transform .15s}
    .entry.open .chev{transform:rotate(90deg)}
    .detail{padding:0 1.15rem 1rem;border-bottom:1px solid var(--border);
      background:var(--surface-2)}
    .checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
      gap:9px;margin:.2rem 0 .9rem}
    .chk{border:1px solid var(--border);border-radius:11px;padding:.65rem .8rem;
      background:var(--surface)}
    .chk .ck{font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint)}
    .chk .cv{font-size:12.5px;font-weight:700;margin-top:3px}
    .chk .cw{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.45}
    .cv.ok{color:var(--green)} .cv.no{color:var(--red)} .cv.unk{color:var(--yellow)}
    .note-lab{font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;
      color:var(--faint);margin-bottom:5px}
    .note{width:100%;min-height:62px;resize:vertical;background:var(--surface);
      color:var(--text);border:1px solid var(--border);border-radius:10px;
      padding:.6rem .75rem;font:inherit;font-size:12.5px;line-height:1.5}
    .note:focus{outline:none;border-color:var(--accent)}
    .note-hint{font-size:10.5px;color:var(--faint);margin-top:5px}
    .saved{color:var(--green)}

    .filter-note{display:flex;justify-content:space-between;align-items:center;
      gap:10px;flex-wrap:wrap;padding:.6rem 1.15rem;background:var(--surface-2);
      border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}
    .filter-note button{background:none;border:1px solid var(--border);color:var(--text);
      border-radius:100px;padding:2px 11px;font:inherit;font-size:11px;cursor:pointer}

    .matrix{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .cell{border:1px solid var(--border);border-radius:13px;padding:.9rem 1rem;position:relative}
    .cell .tag{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
    .cell .big{font-size:.93rem;font-weight:700;color:var(--text-strong);margin-top:.3rem}
    .cell .count{position:absolute;top:.8rem;right:1rem;font-size:1.3rem;font-weight:700;color:var(--faint)}
    .cell.lucky{border-color:rgba(245,158,11,.55)}
    .cell.lucky .big,.cell.lucky .count{color:var(--accent)}
    .cell.good{border-color:rgba(74,222,128,.32)}

    .entry{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;
      padding:.8rem 1.15rem;border-bottom:1px solid var(--border)}
    .entry:last-child{border-bottom:0}
    .entry .t{font-size:11.5px;color:var(--faint)}
    .side{font-size:9.5px;font-weight:700;letter-spacing:1px;padding:2px 7px;border-radius:5px;text-transform:uppercase}
    .side.UP{background:var(--green-bg);color:var(--green)}
    .side.DOWN{background:var(--red-bg);color:var(--red)}
    .inst{font-size:12.5px;color:var(--text-strong);font-weight:600}
    .line2{font-size:11.5px;color:var(--muted);margin-top:3px}
    .verdict{font-size:9.5px;font-weight:700;letter-spacing:.7px;padding:3px 9px;border-radius:100px;border:1px solid}
    .verdict.PASS{background:var(--green-bg);color:var(--green);border-color:rgba(74,222,128,.35)}
    .verdict.FAIL{background:var(--red-bg);color:var(--red);border-color:rgba(248,113,113,.35)}
    .verdict.UNKNOWN{background:var(--yellow-bg);color:var(--yellow);border-color:rgba(250,204,21,.35)}
    .lucky-tag{font-size:9px;font-weight:700;letter-spacing:.7px;color:var(--accent);
      border:1px solid var(--accent);border-radius:4px;padding:1px 5px;margin-left:5px}
    .pnl{font-size:13px;font-weight:700;text-align:right}
    .pnl.pos{color:var(--green)} .pnl.neg{color:var(--red)}

    .warn{border-left:3px solid var(--accent);background:var(--surface-2);padding:.9rem 1.1rem;
      border-radius:0 12px 12px 0;margin-bottom:1rem;font-size:.9rem}
    .warn b{color:var(--text-strong)}
    .msg{padding:2.5rem 1.2rem;text-align:center;color:var(--muted);font-size:.92rem}
    .msg code{background:var(--surface-2);padding:2px 7px;border-radius:5px;font-size:.85em}

    @media (max-width:720px){
      .stats{grid-template-columns:1fr 1fr}
      .stat{border-bottom:1px solid var(--border)}
      .stat:nth-child(2){border-right:0}
      .stat:nth-child(3),.stat:nth-child(4){border-bottom:0}
      .matrix{grid-template-columns:1fr}
      .entry{grid-template-columns:56px 1fr}
      .entry .pnl{grid-column:2;text-align:left}
    }
  </style>
</head>
<body>

  <nav>
    <a href="../../" class="nav-brand">
      <div class="nav-logo">📓</div>
      <div>
        <div class="nav-brand-text">My Journal</div>
        <div class="nav-brand-sub">private</div>
      </div>
    </a>
    <div class="theme-switch" id="themeSwitch" role="group" aria-label="Colour theme">
      <button type="button" class="ts-opt" data-set-theme="light" aria-pressed="false" title="Light theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <button type="button" class="ts-opt" data-set-theme="dark" aria-pressed="false" title="Dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
    </div>
  </nav>

  <div class="wrap">
    <div class="top">
      <h1>My Journal</h1>
      <div style="text-align:right">
        <span class="private">● Private</span>
        <div class="stamp" id="stamp"></div>
      </div>
    </div>

    <div id="app"><div class="msg">Loading…</div></div>
  </div>

  <script>
    (function () {
      // Theme — same contract as every other page.
      const sw = document.getElementById('themeSwitch');
      function paint(t) {
        document.documentElement.setAttribute('data-theme', t);
        sw.querySelectorAll('.ts-opt').forEach(b => {
          const on = b.dataset.setTheme === t;
          b.classList.toggle('is-on', on);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
      }
      paint(document.documentElement.getAttribute('data-theme') || 'dark');
      sw.addEventListener('click', e => {
        const b = e.target.closest('.ts-opt'); if (!b) return;
        paint(b.dataset.setTheme);
        try { localStorage.setItem('lm-theme', b.dataset.setTheme); } catch (err) {}
      });

      const app = document.getElementById('app');
      const money = (v, unit) => {
        if (v === null || v === undefined) return '—';
        const s = v >= 0 ? '+' : '−';
        const n = Math.abs(v).toLocaleString('en-IN', { maximumFractionDigits: 0 });
        return unit === 'PTS' ? `${s}${n} pts` : `${s}₹${n}`;
      };

      // Cache-busted so a phone never shows yesterday's journal from cache —
      // the exact failure that made the live-market page look broken before.
      fetch('journal.json?t=' + Date.now(), { cache: 'no-store' })
        .then(r => {
          if (!r.ok) throw new Error(`journal.json returned ${r.status}`);
          return r.json();
        })
        .then(render)
        .catch(err => {
          // Report the real reason. A generic "no data" message hid a caching
          // bug for two days on the live-market page.
          app.innerHTML = `<div class="msg">
            Could not load your journal.<br><br>
            <code>${String(err.message || err)}</code><br><br>
            The nightly job uploads <code>journal.json</code> next to this page
            after each trading day. If it has never run, there is nothing here yet.
          </div>`;
        });

      function render(d) {
        const s = d.summary;
        document.getElementById('stamp').textContent =
          'updated ' + new Date(d.generated_at).toLocaleString('en-IN',
            { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

        const parts = [];

        if (s.lucky_exceeds_earned) {
          parts.push(`<div class="warn"><b>Lucky wins now outnumber earned wins.</b>
            Your P&L is telling you a story your process hasn't earned yet.</div>`);
        }

        parts.push(`<div class="stats">
          <div class="stat"><div class="k">Rules followed</div>
            <div class="v ${s.discipline_pct >= 70 ? 'good' : s.discipline_pct === null ? '' : 'bad'}">
              ${s.discipline_pct === null ? '—' : s.discipline_pct + '%'}</div></div>
          <div class="stat"><div class="k">Current streak</div>
            <div class="v">${s.streak}<span class="sfx"> days</span></div></div>
          <div class="stat"><div class="k">Lucky wins</div>
            <div class="v warn">${s.matrix.lucky}</div></div>
          <div class="stat"><div class="k">Net P&L</div>
            <div class="v ${(s.net_pnl || 0) >= 0 ? 'good' : 'bad'}">${money(s.net_pnl, s.net_unit)}</div></div>
        </div>`);

        // ── Calendar heatmap ──
        // A day's colour is its WORST outcome, not its average: one broken
        // rule in a day of good ones is the thing worth seeing. LUCKY outranks
        // everything, because a rule broken on a winning day is the failure
        // most likely to be repeated.
        const byDate = {};
        d.days.forEach(x => { byDate[x.date] = x; });

        function dayClass(x) {
          if (!x) return 'none';
          if (x.flat) return 'FLAT';
          const broke = (x.trades || []).some(t => t.setup === 'FAIL' || !t.within_limit);
          if (broke && (x.pnl || 0) > 0) return 'LUCKY';
          if (broke) return 'FAIL';
          if ((x.trades || []).some(t => t.setup === 'UNKNOWN')) return 'UNKNOWN';
          return 'PASS';
        }
        const CLASS_WORD = { PASS: 'rules followed', FAIL: 'rule broken',
          LUCKY: 'rule broken — but won', UNKNOWN: 'no data to grade',
          FLAT: 'no trade taken', none: 'nothing logged' };

        const months = [...new Set(d.days.map(x => x.date.slice(0, 7)))].sort();
        const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const cals = months.map(ym => {
          const [Y, M] = ym.split('-').map(Number);
          const first = new Date(Y, M - 1, 1);
          const total = new Date(Y, M, 0).getDate();
          // Monday-first, matching how a trading week is read.
          const lead = (first.getDay() + 6) % 7;
          const cells = [];
          for (let i = 0; i < lead; i++) cells.push('<div class="day pad"></div>');
          for (let dnum = 1; dnum <= total; dnum++) {
            const iso = `${Y}-${String(M).padStart(2, '0')}-${String(dnum).padStart(2, '0')}`;
            const rec = byDate[iso];
            const wd = new Date(Y, M - 1, dnum).getDay();
            const weekend = (wd === 0 || wd === 6);
            const cls = dayClass(rec);
            const tip = `${iso} — ${CLASS_WORD[cls]}` +
              (rec && rec.pnl != null ? ` · ${money(rec.pnl, rec.unit)}` : '');
            cells.push(`<div class="day ${cls} ${rec ? 'has' : ''}"
              ${weekend && !rec ? 'style="visibility:hidden"' : ''}
              ${rec ? `data-date="${iso}"` : ''} title="${tip}">${dnum}</div>`);
          }
          return `<div class="cal"><div class="cal-title">${MON[M - 1]} ${Y}</div>
            <div class="cal-grid">
              ${['M','T','W','T','F','S','S'].map(x => `<div class="dow">${x}</div>`).join('')}
              ${cells.join('')}
            </div></div>`;
        }).join('');

        parts.push(`<div class="panel"><h2>Every logged day</h2><div class="body">
          <div class="cal-wrap">${cals || '<div class="msg">Nothing logged yet.</div>'}</div>
          <div class="legend">
            <span><i style="background:var(--green-bg);border-color:rgba(74,222,128,.45)"></i>Followed</span>
            <span><i style="background:rgba(245,158,11,.18);border-color:var(--accent)"></i>Lucky (broke, won)</span>
            <span><i style="background:var(--red-bg);border-color:rgba(248,113,113,.45)"></i>Broke</span>
            <span><i style="background:var(--yellow-bg);border-color:rgba(250,204,21,.45)"></i>No data</span>
            <span><i style="background:var(--surface-2);border-color:var(--border-strong)"></i>No trade</span>
          </div>
          <div style="margin-top:.6rem;font-size:11.5px;color:var(--faint)">
            Click a day to see only that day's trades.${s.days_unknown ?
            ` ${s.days_unknown} day(s) marked no-data — monitoring gaps, not rule breaks.` : ''}</div>
        </div></div>`);

        // 2x2
        const m = s.matrix;
        parts.push(`<div class="panel"><h2>Process vs outcome</h2><div class="body">
          <div class="matrix">
            <div class="cell good"><span class="count">${m.good}</span>
              <div class="tag">followed · won</div><div class="big">Earned</div></div>
            <div class="cell"><span class="count">${m.fine}</span>
              <div class="tag">followed · lost</div><div class="big">Acceptable</div></div>
            <div class="cell lucky"><span class="count">${m.lucky}</span>
              <div class="tag">broke · won</div><div class="big">Lucky ⚠</div></div>
            <div class="cell"><span class="count">${m.bad}</span>
              <div class="tag">broke · lost</div><div class="big">The real cost</div></div>
          </div></div></div>`);

        // ── Trades, newest first, each expandable ──
        function esc(v) {
          return String(v == null ? '' : v)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        }
        // Note key: date + time + instrument. Deliberately NOT the array index,
        // so a note stays attached to its trade when a re-sync reorders or
        // merges rows -- which is exactly what happened when partial fills were
        // collapsed from three rows into one.
        const noteKey = (day, t) => `jn:${day.date}:${t.time}:${t.instrument || ''}`;
        function getNote(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

        function checks(t) {
          const zone = t.setup === 'PASS' ? ['ok', 'Inside a rated zone']
                     : t.setup === 'FAIL' ? ['no', 'Not in a rated zone']
                     : ['unk', 'Could not check'];
          const conf = t.confirmation === 'PASS' ? ['ok', 'System confirmed']
                     : t.confirmation === 'FAIL' ? ['no', 'No confirmation']
                     : ['unk', 'Could not check'];
          const lim = t.within_limit ? ['ok', `Trade ${t.trade_number} of ${d.rules.max_trades_per_day}`]
                                     : ['no', `Trade ${t.trade_number} — over your limit of ${d.rules.max_trades_per_day}`];
          return `<div class="checks">
            <div class="chk"><div class="ck">Zone</div>
              <div class="cv ${zone[0]}">${zone[1]}</div>
              <div class="cw">${esc(t.why) || `Entry must sit inside an ${d.rules.zone_ratings.join('/')} zone from that morning's map.`}</div></div>
            <div class="chk"><div class="ck">Confirmation</div>
              <div class="cv ${conf[0]}">${conf[1]}</div>
              <div class="cw">A system alert within ±${d.rules.confirmation_window_minutes} min of entry.</div></div>
            <div class="chk"><div class="ck">Daily limit</div>
              <div class="cv ${lim[0]}">${lim[1]}</div>
              <div class="cw">${t.rule_break ? esc(t.rule_break) : 'Counts positions taken, not broker fills.'}</div></div>
          </div>`;
        }

        const rows = [];
        d.days.slice().reverse().forEach(day => {
          if (day.flat) {
            rows.push(`<div class="entry" data-date="${day.date}">
              <div class="t mono">${day.date.slice(5)}</div>
              <div><span class="verdict PASS">NO TRADE</span>
              <div class="line2">Sat out — counts as a disciplined day.</div></div><div></div></div>`);
            return;
          }
          (day.trades || []).forEach((t, i) => {
            const broke = t.setup === 'FAIL' || !t.within_limit;
            const v = !t.within_limit ? 'FAIL' : t.setup;
            const vtxt = !t.within_limit ? 'OVER LIMIT' : t.setup === 'PASS' ? 'FOLLOWED'
                       : t.setup === 'UNKNOWN' ? 'NO DATA' : 'BROKE';
            const lucky = broke && t.pnl > 0;
            const id = `${day.date}-${i}`;
            const k = noteKey(day, t);
            const note = getNote(k);
            rows.push(`<div class="entry clickable" data-toggle="${id}" data-date="${day.date}">
              <div class="t mono">${day.date.slice(5)}<br>${t.time || ''}</div>
              <div>
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                  <span class="chev">▶</span>
                  <span class="side ${t.direction}">${t.direction === 'UP' ? 'Bullish' : 'Bearish'}</span>
                  <span class="inst">${esc(t.instrument)}</span>
                  <span class="verdict ${v}">${vtxt}</span>
                  ${lucky ? '<span class="lucky-tag">LUCKY</span>' : ''}
                  ${note ? '<span class="lucky-tag" style="color:var(--muted);border-color:var(--border)">NOTE</span>' : ''}
                </div>
                <div class="line2">${t.level ? 'NIFTY @ <span class="mono">' + esc(t.level) + '</span> · ' : ''}${esc(t.why)}</div>
              </div>
              <div class="pnl ${(t.pnl || 0) >= 0 ? 'pos' : 'neg'}">${money(t.pnl, day.unit)}</div>
            </div>
            <div class="detail" id="d-${id}" data-date="${day.date}" style="display:none">
              ${checks(t)}
              ${t.notes ? `<div class="cw" style="margin-bottom:.8rem;color:var(--muted);font-size:11.5px">
                 <b>From the broker:</b> ${esc(t.notes)}</div>` : ''}
              <div class="note-lab">My note — what was I thinking?</div>
              <textarea class="note" data-key="${k}"
                placeholder="What did I see? What would I do differently?">${esc(note)}</textarea>
              <div class="note-hint" data-hint="${k}">Saved on this device only.</div>
            </div>`);
          });
        });
        parts.push(`<div class="panel"><h2>Trades</h2>
          <div class="filter-note" id="filterNote" style="display:none">
            <span id="filterText"></span><button type="button" id="clearFilter">Show all</button>
          </div>
          ${rows.join('') || '<div class="msg">Nothing logged yet.</div>'}</div>`);

        app.innerHTML = parts.join('');
        wire();
      }

      function wire() {
        // Expand / collapse a trade.
        app.addEventListener('click', e => {
          const row = e.target.closest('[data-toggle]');
          if (row) {
            const box = document.getElementById('d-' + row.dataset.toggle);
            if (box) {
              const open = box.style.display !== 'none';
              box.style.display = open ? 'none' : 'block';
              row.classList.toggle('open', !open);
            }
            return;
          }
          // Click a calendar day -> show only that day.
          const cell = e.target.closest('.day.has');
          if (cell) { applyFilter(cell.dataset.date); return; }
          if (e.target.id === 'clearFilter') applyFilter(null);
        });

        // Notes. Saved per keystroke (debounced) rather than behind a button --
        // an unsaved note is worse than no note, and nobody presses save.
        let timer;
        app.addEventListener('input', e => {
          const ta = e.target.closest('.note');
          if (!ta) return;
          clearTimeout(timer);
          timer = setTimeout(() => {
            const hint = app.querySelector(`[data-hint="${CSS.escape(ta.dataset.key)}"]`);
            try {
              localStorage.setItem(ta.dataset.key, ta.value);
              if (hint) { hint.innerHTML = '<span class="saved">Saved</span> — on this device only.'; }
            } catch (err) {
              // Private-mode Safari and a full quota both land here. Say so:
              // silently dropping what someone just typed is the worst option.
              if (hint) hint.textContent = 'Could NOT save — ' + (err.message || err);
            }
          }, 400);
        });
      }

      function applyFilter(date) {
        const note = document.getElementById('filterNote');
        const text = document.getElementById('filterText');
        app.querySelectorAll('.day.sel').forEach(x => x.classList.remove('sel'));
        // Collapse everything first. Leaving a row expanded while its detail is
        // filtered out desynchronises the chevron from what is on screen.
        app.querySelectorAll('.detail').forEach(x => { x.style.display = 'none'; });
        app.querySelectorAll('.entry.open').forEach(x => x.classList.remove('open'));
        app.querySelectorAll('.entry[data-date], .detail[data-date]').forEach(el => {
          const show = !date || el.dataset.date === date;
          if (el.classList.contains('detail')) return;   // stays collapsed
          el.style.display = show ? '' : 'none';
        });
        if (date) {
          const cell = app.querySelector(`.day[data-date="${date}"]`);
          if (cell) cell.classList.add('sel');
          text.textContent = `Showing ${date} only.`;
          note.style.display = 'flex';
        } else {
          note.style.display = 'none';
        }
      }
    })();
  </script>
</body>
</html>
